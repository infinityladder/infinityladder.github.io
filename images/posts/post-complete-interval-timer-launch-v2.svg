<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Complete Interval Timer launch feature graphic with app icon">
  <defs>
    <linearGradient id="cit-bg-v2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#142540"/>
      <stop offset="55%" stop-color="#203864"/>
      <stop offset="100%" stop-color="#2E75B6"/>
    </linearGradient>
    <linearGradient id="cit-line-v2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78AEE0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#78AEE0" stop-opacity="0"/>
    </linearGradient>
    <filter id="cit-soft-v2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="cit-shadow-v2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#061222" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#cit-bg-v2)"/>

  <circle cx="180" cy="140" r="120" fill="rgba(46, 117, 182, 0.18)"/>
  <circle cx="980" cy="130" r="150" fill="rgba(120, 174, 224, 0.15)"/>
  <circle cx="880" cy="560" r="210" fill="rgba(46, 117, 182, 0.2)"/>

  <g opacity="0.96">
    <circle cx="325" cy="350" r="160" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="16"/>
    <circle cx="325" cy="350" r="160" fill="none" stroke="#78AEE0" stroke-width="16" stroke-dasharray="640 365" stroke-linecap="round"/>
    <circle cx="325" cy="350" r="112" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="10" stroke-dasharray="10 13"/>
    <line x1="325" y1="350" x2="325" y2="272" stroke="#78AEE0" stroke-width="7" stroke-linecap="round"/>
    <line x1="325" y1="350" x2="378" y2="350" stroke="#78AEE0" stroke-width="7" stroke-linecap="round"/>
    <circle cx="325" cy="350" r="11" fill="#78AEE0"/>
  </g>

  <rect x="510" y="176" width="540" height="352" rx="30" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="2"/>
  <rect x="552" y="230" width="255" height="22" rx="11" fill="rgba(255, 255, 255, 0.34)"/>
  <rect x="552" y="266" width="218" height="16" rx="8" fill="rgba(255, 255, 255, 0.2)"/>
  <rect x="552" y="306" width="140" height="48" rx="14" fill="rgba(46, 117, 182, 0.5)"/>
  <rect x="706" y="306" width="112" height="48" rx="14" fill="rgba(255, 255, 255, 0.21)"/>
  <rect x="552" y="380" width="250" height="14" rx="7" fill="rgba(255, 255, 255, 0.26)"/>
  <rect x="552" y="410" width="212" height="14" rx="7" fill="rgba(255, 255, 255, 0.2)"/>
  <rect x="552" y="440" width="168" height="14" rx="7" fill="rgba(255, 255, 255, 0.16)"/>

  <g filter="url(#cit-shadow-v2)">
    <rect x="832" y="246" width="176" height="176" rx="40" fill="#ffffff"/>
    <image href="/images/posts/complete-interval-timer-launch/app-icon-512.png" x="844" y="258" width="152" height="152" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <path d="M0 620 L1200 510" stroke="url(#cit-line-v2)" stroke-width="120" opacity="0.18"/>
  <circle cx="1030" cy="560" r="85" fill="rgba(120, 174, 224, 0.2)" filter="url(#cit-soft-v2)"/>
</svg>
